# Helm values for zitadel/zitadel (chart 9.x — app v4.x)
# Chart: https://charts.zitadel.com
# Reference: https://zitadel.com/docs/self-hosting/deploy/kubernetes
#
# External Postgres (postgres.data.svc.cluster.local), no bundled DB/Redis.
# TLS terminate ở ingress-nginx (ExternalSecure=true, TLS.Enabled=false).
# `ingress.controller: nginx` để chart tự inject annotation
# `nginx.ingress.kubernetes.io/backend-protocol: GRPC` cho h2c.

replicaCount: 1

zitadel:
  # Masterkey lấy từ secret zitadel-secrets, key ZITADEL_MASTERKEY (32 ký tự).
  masterkeySecretName: zitadel-secrets

  configmapConfig:
    ExternalDomain: auth.cunghoclaptrinh.online
    ExternalPort: 443
    ExternalSecure: true
    TLS:
      Enabled: false
    Database:
      Postgres:
        # User connection: dùng DSN env (ZITADEL_DATABASE_POSTGRES_DSN).
        # Admin connection: vẫn cần Host/Port/Admin block + env password riêng,
        # vì DSN env chỉ áp cho User. Init job dùng Admin connection.
        Host: postgres.data.svc.cluster.local
        Port: 5432
        MaxOpenConns: 10
        MaxIdleConns: 5
        Admin:
          Username: zitadel
          ExistingDatabase: zitadel
          SSL:
            Mode: disable
    FirstInstance:
      Org:
        Name: Goshop
        Human:
          UserName: admin
          FirstName: Admin
          LastName: Goshop
          Email:
            Address: admin@cunghoclaptrinh.online
            Verified: true
    DefaultInstance:
      SMTPConfiguration:
        SMTP:
          Host: smtp.resend.com:465
          User: resend
        From: noreply@cunghoclaptrinh.online
        FromName: Goshop
        TLS: true
        ReplyToAddress: noreply@cunghoclaptrinh.online

# Env override config từ secret zitadel-secrets.
# Chart 9.x: env là field top-level (KHÔNG nằm trong zitadel:).
env:
  - name: ZITADEL_DATABASE_POSTGRES_DSN
    valueFrom:
      secretKeyRef: {name: zitadel-secrets, key: ZITADEL_DB_DSN}
  - name: ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef: {name: zitadel-secrets, key: ZITADEL_DB_PASSWORD}
  - name: ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD
    valueFrom:
      secretKeyRef: {name: zitadel-secrets, key: ZITADEL_ADMIN_PASSWORD}
  - name: ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_PASSWORD
    valueFrom:
      secretKeyRef: {name: zitadel-secrets, key: ZITADEL_SMTP_PASSWORD}

ingress:
  enabled: true
  controller: nginx           # auto-inject backend-protocol: GRPC annotation
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: auth.cunghoclaptrinh.online
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts: [auth.cunghoclaptrinh.online]
      secretName: zitadel-tls

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits:   {cpu: 500m, memory: 512Mi}

# Login UI là service tách riêng trong chart 9.x — cần ingress riêng cho path /ui/v2/login.
login:
  ingress:
    enabled: true
    controller: nginx
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: auth.cunghoclaptrinh.online
        paths:
          - path: /ui/v2/login
            pathType: Prefix
    tls:
      - hosts: [auth.cunghoclaptrinh.online]
        secretName: zitadel-tls
