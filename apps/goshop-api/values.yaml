# goshop-api — Go BE, ClusterIP internal. FE proxies /api → service "goshop-api".
replicaCount: 2
image:
  repository: ghcr.io/quangdangfit/goshop
  tag: "master-243e2af" # auto-bumped by argocd-image-updater
  pullPolicy: Always
containerPort: 8888
extraPorts:
- {name: grpc, containerPort: 8889}
service:
  type: ClusterIP
  port: 8888
  extraPorts:
  - {name: grpc, port: 8889, targetPort: grpc}
ingress:
  enabled: false # BE nội bộ — không expose ra ngoài
env:
  CONFIG_FILE: /app/config.yaml
envFromSecret: goshop-secrets
configFile:
  enabled: true
  mountPath: /app/config.yaml
  subPath: config.yaml
  content: |
    environment=production
    http_port=8888
    grpc_port=8889
    redis_db=0
    cors_allowed_origins=*
    rate_limit_requests=100
    rate_limit_window_seconds=60
    smtp_host=
    smtp_port=25
    email_from=no-reply@goshop.local
    auth_mode=oidc
    oidc_issuer=https://auth.cunghoclaptrinh.online/application/o/goshop/
    oidc_redirect_url=https://goshop.cunghoclaptrinh.online/api/v1/auth/callback
    oidc_post_logout_url=https://goshop.cunghoclaptrinh.online/
    oidc_jwks_url=https://auth.cunghoclaptrinh.online/application/o/goshop/jwks/
    oidc_scopes=openid,email,profile
    frontend_base_url=https://goshop.cunghoclaptrinh.online
externalSecret:
  enabled: false # ES được apply riêng từ apps/goshop-api/externalsecret.yaml
probes:
  enabled: true
  type: tcp
  port: 8888
imageUpdater:
  enabled: true
  allowTags: "regexp:^master-[0-9a-f]{7,40}$"
  repo: https://github.com/quangdangfit/deployment
  branch: main
  valuesPath: apps/goshop-api/values.yaml
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 500m, memory: 512Mi}
