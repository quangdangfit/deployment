replicaCount: 1

image:
  repository: nginx
  tag: "1.27-alpine"
  pullPolicy: IfNotPresent

containerPort: 80

# Optional extra container ports (e.g. gRPC). Each entry becomes a
# containerPort on the pod AND a port on the Service.
# Example: [{name: grpc, containerPort: 8889}]
extraPorts: []

service:
  type: ClusterIP
  port: 80
  # Optional extra Service ports — paired with extraPorts above.
  # Example: [{name: grpc, port: 8889, targetPort: grpc}]
  extraPorts: []

ingress:
  enabled: false
  className: nginx
  host: ""
  tlsSecretName: ""
  clusterIssuer: letsencrypt-prod

env: {}        # KEY: value pairs → injected as env vars
envFromSecret: ""   # optional Secret name to envFrom

resources:
  requests: {cpu: 10m, memory: 32Mi}
  limits: {cpu: 200m, memory: 128Mi}

# Optional probes. Default off (back-compat). Set type: tcp or http.
probes:
  enabled: false
  type: tcp                  # tcp | http
  port: 0                    # 0 → falls back to containerPort
  path: /                    # only used when type=http
  initialDelaySeconds: 5
  periodSeconds: 10

# Optional persistent volume (for SQLite, file cache, etc).
# Enables strategy: Recreate so the single PVC isn't double-mounted on rollout.
persistence:
  enabled: false
  size: 1Gi
  mountPath: /data
  storageClassName: ""   # "" = default StorageClass (local-path on k3s)

# Optional config file rendered as a ConfigMap and mounted into the container
# as a single file (subPath mount). For app config that lives outside env vars.
configFile:
  enabled: false
  mountPath: /app/config.yaml
  subPath: config.yaml
  content: ""

# Optional ExternalSecret (Doppler → k8s Secret). When enabled, the rendered
# Secret name is <release>-secrets; reference it via envFromSecret to inject.
externalSecret:
  enabled: false
  storeName: doppler
  refreshInterval: 1h
  keys: []   # list of Doppler keys to mirror (same name on both sides)

# Optional ArgoCD Image Updater. CR is rendered into ns `argocd`.
# Requires CI to push tags matching allowTags pattern.
imageUpdater:
  enabled: false
  allowTags: "regexp:^main-[0-9a-f]{7}$"
  repo: https://github.com/quangdangfit/deployment
  branch: main
  valuesPath: ""   # repo-root absolute path, e.g. /apps/snapnews/values.yaml
